groups:
  - name: jodo-app-alerts
    rules:
      - alert: HighErrorRate
        expr: rate(app_requests_total{http_status=~"5.."}[5m]) > 0.05
        for: 2m
        labels:
          severity: page
        annotations:
          summary: "High 5xx error rate ({{ $value }})"
          description: "Service is returning many 5xx responses."
      - alert: HighLatency
        expr: histogram_quantile(0.95, sum(rate(app_request_latency_seconds_bucket[5m])) by (le, endpoint)) > 1
        for: 2m
        labels:
          severity: page
